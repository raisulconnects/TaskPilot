name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskpilot
          POSTGRES_PASSWORD: taskpilot
          POSTGRES_DB: taskpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U taskpilot"
          --interval 10s --timeout 5s --retries 5
    defaults:
      run:
        working-directory: server
    env:
      JWT_SECRET: ci-test-secret
      DATABASE_URL: postgresql://taskpilot:taskpilot@localhost:5433/taskpilot?schema=public
      TEST_DATABASE_URL: postgresql://taskpilot:taskpilot@localhost:5433/taskpilot?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
